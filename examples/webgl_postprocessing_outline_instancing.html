<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - post processing - Outline Pass instanced selection</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
		<style>
			#panel {
				position: absolute;
				top: 8px;
				left: 8px;
				z-index: 1;
			}
			#panel button {
				display: block;
				margin-bottom: 6px;
				min-width: 240px;
			}
			#status {
				color: #fff;
				font-family: monospace;
				font-size: 12px;
				text-shadow: 0 0 3px #000;
			}
		</style>
	</head>
	<body>
		<div id="panel">
			<button id="button-single">Single instance</button>
			<button id="button-clear">Clear selection</button>
			<button id="button-mixed">Instance + regular mesh</button>
			<button id="button-occluders">Occluders scenario</button>
			<button id="button-out-of-range">Out-of-range IDs (no outline)</button>
			<button id="button-whole">Whole InstancedMesh selection</button>
			<button id="button-animate">Move/rotate parent group: off</button>
			<div id="status">Click any box. Raycaster provides the instance ID.</div>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

			const INSTANCE_COUNT = 9;

			let renderer, scene, camera, composer, outlinePass;
			let instancedMesh, regularMesh, regularOccluder, instanceOccluder, parentGroup;
			let animateParent = false;

			const raycaster = new THREE.Raycaster();
			const pointer = new THREE.Vector2();
			const clock = new THREE.Clock();
			const status = document.getElementById( 'status' );

			init();
			animate();

			function init() {

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( 1 );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setClearColor( 0x202028, 1 );
				document.body.appendChild( renderer.domElement );

				scene = new THREE.Scene();
				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 1.5, 11 );
				camera.lookAt( 0, 0, 0 );

				scene.add( new THREE.AmbientLight( 0xffffff, 1.2 ) );

				// The InstancedMesh lives inside a parent group so outline follow-through
				// of parent transforms can be verified.
				parentGroup = new THREE.Group();
				scene.add( parentGroup );

				const boxGeometry = new THREE.BoxGeometry( 0.9, 0.9, 0.9 );
				const boxMaterial = new THREE.MeshStandardMaterial( { color: 0x4a90d9, roughness: 0.6 } );
				instancedMesh = new THREE.InstancedMesh( boxGeometry, boxMaterial, INSTANCE_COUNT );

				const dummy = new THREE.Object3D();

				for ( let i = 0; i < INSTANCE_COUNT; i ++ ) {

					const column = i % 3;
					const row = Math.floor( i / 3 );
					dummy.position.set( ( column - 1 ) * 2.2, ( row - 1 ) * 2.2, 0 );
					dummy.updateMatrix();
					instancedMesh.setMatrixAt( i, dummy.matrix );

				}

				// Box 4 moves in front of the grid center and stays in the same InstancedMesh
				// draw call, so it can occlude another instance of its own batch.
				dummy.position.set( 0, 0, 1.6 );
				dummy.updateMatrix();
				instancedMesh.setMatrixAt( 4, dummy.matrix );
				instancedMesh.instanceMatrix.needsUpdate = true;

				parentGroup.add( instancedMesh );

				// Regular (non-instanced) opaque mesh, selectable as a whole object.
				regularMesh = new THREE.Mesh(
					new THREE.SphereGeometry( 0.75, 32, 24 ),
					new THREE.MeshStandardMaterial( { color: 0xd97a4a, roughness: 0.6 } )
				);
				regularMesh.position.set( 4.6, 0, 0 );
				scene.add( regularMesh );

				// Regular opaque occluder that covers part of the instanced grid.
				regularOccluder = new THREE.Mesh(
					new THREE.BoxGeometry( 1.1, 3.4, 1.1 ),
					new THREE.MeshStandardMaterial( { color: 0x666666, roughness: 0.9 } )
				);
				regularOccluder.position.set( - 2.2, 0, 1.8 );
				scene.add( regularOccluder );

				// Second InstancedMesh used as an occluder only; it is never selected.
				const occluderGeometry = new THREE.CylinderGeometry( 0.5, 0.5, 1.6, 24 );
				const occluderMaterial = new THREE.MeshStandardMaterial( { color: 0x888844, roughness: 0.8 } );
				instanceOccluder = new THREE.InstancedMesh( occluderGeometry, occluderMaterial, 2 );
				dummy.position.set( 2.2, 0, 1.8 );
				dummy.updateMatrix();
				instanceOccluder.setMatrixAt( 0, dummy.matrix );
				dummy.position.set( 2.2, 2.2, 1.8 );
				dummy.updateMatrix();
				instanceOccluder.setMatrixAt( 1, dummy.matrix );
				instanceOccluder.instanceMatrix.needsUpdate = true;
				scene.add( instanceOccluder );

				composer = new EffectComposer( renderer );
				composer.addPass( new RenderPass( scene, camera ) );

				outlinePass = new OutlinePass(
					new THREE.Vector2( window.innerWidth, window.innerHeight ),
					scene,
					camera
				);

				// Two clearly different edge colors: cyan where the outline is visible,
				// red where the outline is hidden behind an occluder.
				outlinePass.visibleEdgeColor.set( 0x00ffff );
				outlinePass.hiddenEdgeColor.set( 0xff2222 );
				outlinePass.edgeThickness = 2.0;
				outlinePass.edgeStrength = 4.0;
				composer.addPass( outlinePass );
				composer.addPass( new OutputPass() );

				renderer.domElement.addEventListener( 'pointerdown', onPointerDown );
				window.addEventListener( 'resize', onResize );

				document.getElementById( 'button-single' ).addEventListener( 'click', () => selectScenario( 'single' ) );
				document.getElementById( 'button-clear' ).addEventListener( 'click', () => selectScenario( 'clear' ) );
				document.getElementById( 'button-mixed' ).addEventListener( 'click', () => selectScenario( 'mixed' ) );
				document.getElementById( 'button-occluders' ).addEventListener( 'click', () => selectScenario( 'occluders' ) );
				document.getElementById( 'button-out-of-range' ).addEventListener( 'click', () => selectScenario( 'out-of-range' ) );
				document.getElementById( 'button-whole' ).addEventListener( 'click', () => selectScenario( 'whole' ) );
				document.getElementById( 'button-animate' ).addEventListener( 'click', toggleAnimation );

				selectScenario( 'single' );

				// Hooks used by the repeatable Puppeteer image check.
				window.outlineDemo = { selectScenario, toggleAnimation, composer, outlinePass, scene };

			}

			function clearSelection() {

				outlinePass.selectedObjects.length = 0;
				outlinePass.clearSelectedInstances();

			}

			function selectScenario( name ) {

				clearSelection();

				switch ( name ) {

					case 'single':
						// One instance only; box 4 is the front-center same-batch occluder.
						outlinePass.setSelectedInstances( instancedMesh, [ 1 ] );
						status.textContent = 'Single instance selected: ID 1.';
						break;

					case 'clear':
						status.textContent = 'Selection cleared; the frame matches the plain scene.';
						break;

					case 'mixed':
						outlinePass.setSelectedInstances( instancedMesh, [ 0, 6 ] );
						outlinePass.selectedObjects.push( regularMesh );
						status.textContent = 'Instances 0 and 6 plus the regular sphere are selected.';
						break;

					case 'occluders':
						// The center column is covered by the gray box (left), the yellow
						// InstancedMesh cylinders (right) and same-batch box 4 (front).
						outlinePass.setSelectedInstances( instancedMesh, [ 3, 4, 5 ] );
						status.textContent = 'Instances 3-5 selected; watch cyan visible vs red hidden edges.';
						break;

					case 'out-of-range':
						// All IDs are invalid for a 9-instance mesh; nothing may be outlined.
						outlinePass.setSelectedInstances( instancedMesh, [ - 1, 9, 42, 1.5 ] );
						status.textContent = 'Only out-of-range IDs were given; no outline is allowed.';
						break;

					case 'whole':
						// Whole-object selection wins over any per-instance selection.
						outlinePass.setSelectedInstances( instancedMesh, [ 1 ] );
						outlinePass.selectedObjects.push( instancedMesh );
						status.textContent = 'The whole InstancedMesh is selected; every box is outlined.';
						break;

				}

				return name;

			}

			function toggleAnimation() {

				animateParent = ! animateParent;
				document.getElementById( 'button-animate' ).textContent =
					'Move/rotate parent group: ' + ( animateParent ? 'on' : 'off' );
				return animateParent;

			}

			function onPointerDown( event ) {

				const rect = renderer.domElement.getBoundingClientRect();
				pointer.x = ( ( event.clientX - rect.left ) / rect.width ) * 2 - 1;
				pointer.y = - ( ( event.clientY - rect.top ) / rect.height ) * 2 + 1;
				raycaster.setFromCamera( pointer, camera );

				const intersections = raycaster.intersectObject( instancedMesh, false );

				if ( intersections.length > 0 ) {

					const instanceId = intersections[ 0 ].instanceId;
					outlinePass.setSelectedInstances( instancedMesh, [ instanceId ] );
					status.textContent = 'Picked instance ID ' + instanceId + ' from the Raycaster.';

				} else {

					const regularHits = raycaster.intersectObjects( [ regularMesh, regularOccluder ], false );

					if ( regularHits.length > 0 && regularHits[ 0 ].object === regularMesh ) {

						clearSelection();
						outlinePass.selectedObjects.push( regularMesh );
						status.textContent = 'Picked the regular sphere (whole-object selection).';

					}

				}

			}

			function onResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
				composer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				requestAnimationFrame( animate );

				if ( animateParent ) {

					const t = clock.getElapsedTime();
					parentGroup.position.x = Math.sin( t * 0.8 ) * 1.2;
					parentGroup.rotation.y = Math.sin( t * 0.6 ) * 0.6;

				} else {

					parentGroup.position.x = 0;
					parentGroup.rotation.y = 0;

				}

				composer.render();

			}

		</script>
	</body>
</html>
